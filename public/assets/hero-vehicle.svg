<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="Premium electric sedan illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9" />
      <stop offset="0.55" stop-color="#e2e8f0" />
      <stop offset="1" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="0.5" stop-color="#115e59" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.95" />
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="960" height="720" fill="url(#bg)" />
  <circle cx="760" cy="150" r="220" fill="url(#glow)" />

  <!-- floor -->
  <ellipse cx="480" cy="560" rx="360" ry="46" fill="#0f172a" opacity="0.14" />

  <!-- car body -->
  <path d="M170 500c-14 0-24-10-24-23v-52c0-27 16-51 41-61l84-33c14-20 39-32 66-32h190c27 0 52 12 66 32l84 33c25 10 41 34 41 61v52c0 13-10 23-24 23H170z" fill="url(#body)" />

  <!-- cabin glass -->
  <path d="M320 336c6-10 18-16 31-16h172c13 0 25 6 31 16l46 68H274l46-68z" fill="url(#glass)" opacity="0.92" />
  <!-- glass divider -->
  <rect x="470" y="322" width="12" height="82" fill="#0b1220" opacity="0.55" />

  <!-- lights -->
  <path d="M170 420h74c8 0 14 6 14 14v6c0 8-6 14-14 14h-74c-8 0-14-6-14-14v-6c0-8 6-14 14-14z" fill="#fef3c7" opacity="0.95" />
  <path d="M716 420h74c8 0 14 6 14 14v6c0 8-6 14-14 14h-74c-8 0-14-6-14-14v-6c0-8 6-14 14-14z" fill="#fca5a5" opacity="0.9" />

  <!-- side line -->
  <path d="M168 470h624" stroke="#0b1220" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />

  <!-- wheels -->
  <g>
    <circle cx="292" cy="512" r="66" fill="#0f172a" />
    <circle cx="292" cy="512" r="34" fill="#cbd5e1" />
    <circle cx="292" cy="512" r="14" fill="#0f766e" />
  </g>
  <g>
    <circle cx="672" cy="512" r="66" fill="#0f172a" />
    <circle cx="672" cy="512" r="34" fill="#cbd5e1" />
    <circle cx="672" cy="512" r="14" fill="#0f766e" />
  </g>

  <!-- charge indicator -->
  <g transform="translate(430 220)">
    <rect x="0" y="0" width="100" height="56" rx="16" fill="#ffffff" opacity="0.9" />
    <text x="50" y="37" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f766e" text-anchor="middle">96%</text>
  </g>
</svg>
