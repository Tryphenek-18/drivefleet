<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments — DriveFleet</title>
  <meta name="description" content="DriveFleet payment ledger: deposits, final payments, refunds and penalties per rental." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="payments" data-root="../">
  <div class="app-shell">
    <aside id="siteSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <div id="siteTopbar"></div>

      <div class="page-content">
        <div id="authNotice"></div>

        <div class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <a href="../index.html">Home</a>
              <span class="breadcrumb-sep">/</span>
              <span>Payments</span>
            </nav>
            <h1>Payment ledger</h1>
            <p>Every deposit, rental payment, refund and penalty — with a clean audit trail.</p>
          </div>
          <div class="page-header-actions">
            <a class="btn btn-outline" href="rentals.html">Rentals</a>
            <button class="btn btn-primary" id="recordPaymentBtn" type="button">Record payment</button>
          </div>
        </div>

        <div class="grid grid-3">
          <article class="card filter-card">
            <div class="filter-title">Ledger summary</div>
            <div class="summary-list" id="paymentSummary"></div>
          </article>

          <form class="card filter-card" id="paymentFilters" aria-label="Payment filters">
            <div class="form-group">
              <label class="form-label" for="pSearch">Search</label>
              <input class="form-input" type="search" id="pSearch" name="search" placeholder="Reference, customer or vehicle" />
            </div>
            <div class="form-group">
              <label class="form-label" for="pStatusFilter">Status</label>
              <select class="form-select" id="pStatusFilter" name="status">
                <option value="">Any status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="refunded">Refunded</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pMethodFilter">Method</label>
                <select class="form-select" id="pMethodFilter" name="method">
                  <option value="">Any method</option>
                  <option value="card">Card</option>
                  <option value="cash">Cash</option>
                  <option value="bank_transfer">Bank transfer</option>
                  <option value="paypal">PayPal</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="pTypeFilter">Type</label>
                <select class="form-select" id="pTypeFilter" name="type">
                  <option value="">Any type</option>
                  <option value="deposit">Deposit</option>
                  <option value="rental">Rental</option>
                  <option value="refund">Refund</option>
                  <option value="penalty">Penalty</option>
                </select>
              </div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Apply filters</button>
          </form>
        </div>

        <div class="results-bar">
          <span class="results-count" id="resultsCount">Loading payments…</span>
          <button class="btn btn-ghost btn-sm" type="reset" form="paymentFilters">Clear filters</button>
        </div>

        <div id="paymentResults" aria-live="polite"></div>
      </div>

      <footer class="footer" id="siteFooter"></footer>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="../js/app.js"></script>
</body>
</html>
